<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="sf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#bfe3ff"/>
    </linearGradient>
    <filter id="sfGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#sfGlow)"
     stroke="url(#sf)"
     stroke-width="3"
     stroke-linecap="round"
     stroke-linejoin="round"
     fill="none">

    <!-- Основные лучи -->
    <line x1="50" y1="6"  x2="50" y2="94"/>
    <line x1="6"  y1="50" x2="94" y2="50"/>
    <line x1="18" y1="18" x2="82" y2="82"/>
    <line x1="82" y1="18" x2="18" y2="82"/>

    <!-- Веточки: верх -->
    <line x1="50" y1="20" x2="40" y2="10"/>
    <line x1="50" y1="20" x2="60" y2="10"/>
    <line x1="50" y1="32" x2="42" y2="24"/>
    <line x1="50" y1="32" x2="58" y2="24"/>
    <!-- Веточки: низ -->
    <line x1="50" y1="80" x2="40" y2="90"/>
    <line x1="50" y1="80" x2="60" y2="90"/>
    <line x1="50" y1="68" x2="42" y2="76"/>
    <line x1="50" y1="68" x2="58" y2="76"/>
    <!-- Веточки: лево -->
    <line x1="20" y1="50" x2="10" y2="40"/>
    <line x1="20" y1="50" x2="10" y2="60"/>
    <line x1="32" y1="50" x2="24" y2="42"/>
    <line x1="32" y1="50" x2="24" y2="58"/>
    <!-- Веточки: право -->
    <line x1="80" y1="50" x2="90" y2="40"/>
    <line x1="80" y1="50" x2="90" y2="60"/>
    <line x1="68" y1="50" x2="76" y2="42"/>
    <line x1="68" y1="50" x2="76" y2="58"/>
    <!-- Диагонали -->
    <line x1="34" y1="34" x2="26" y2="26"/>
    <line x1="66" y1="66" x2="74" y2="74"/>
    <line x1="66" y1="34" x2="74" y2="26"/>
    <line x1="34" y1="66" x2="26" y2="74"/>
  </g>

  <!-- Центр -->
  <circle cx="50" cy="50" r="4" fill="url(#sf)"/>
</svg>