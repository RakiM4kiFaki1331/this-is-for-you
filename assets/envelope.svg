<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280">
  <defs>
    <linearGradient id="envBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#ff6b85"/>
      <stop offset="100%" stop-color="#a4133c"/>
    </linearGradient>
    <linearGradient id="envFlap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#c9184a"/>
      <stop offset="100%" stop-color="#ff4d6d"/>
    </linearGradient>
    <linearGradient id="envPocket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#c9184a"/>
      <stop offset="100%" stop-color="#7a0c2e"/>
    </linearGradient>
    <filter id="envShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Корпус -->
  <rect x="10" y="10" width="380" height="260" rx="14"
        fill="url(#envBody)" filter="url(#envShadow)"/>

  <!-- Нижний карман -->
  <path d="M10 270 L200 150 L390 270 Z" fill="url(#envPocket)"/>

  <!-- Верхний клапан -->
  <path d="M10 10 L200 150 L390 10 Z" fill="url(#envFlap)" opacity="0.97"/>

  <!-- Линии сгиба -->
  <line x1="10" y1="270" x2="200" y2="150" stroke="#7a0c2e" stroke-width="1.2" opacity="0.6"/>
  <line x1="390" y1="270" x2="200" y2="150" stroke="#7a0c2e" stroke-width="1.2" opacity="0.6"/>
  <line x1="10" y1="10"  x2="200" y2="150" stroke="#7a0c2e" stroke-width="1.2" opacity="0.5"/>
  <line x1="390" y1="10" x2="200" y2="150" stroke="#7a0c2e" stroke-width="1.2" opacity="0.5"/>

  <!-- Блик -->
  <rect x="22" y="22" width="356" height="36" rx="8" fill="#fff" opacity="0.10"/>
</svg>